name: CI
on:
  pull_request:
  push:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
      - name: Policy checks (assignment constraints)
        run: |
          test -z "$(find app/src -name '*.java')" || { echo "Java files are not allowed"; exit 1; }
          test ! -d app/src/main/res/layout || { echo "XML layouts are not allowed"; exit 1; }
      - name: Make gradlew executable
        run: chmod +x ./gradlew
      - name: Unit tests and debug build
        run: ./gradlew testDebugUnitTest assembleDebug